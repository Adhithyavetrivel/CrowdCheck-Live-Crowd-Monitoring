# CrowdCheck Spring Boot Configuration
spring.application.name=CrowdCheck
server.port=8080

# MySQL DataSource Configuration
# Override using environment variables (DB_URL, DB_USER, DB_PASSWORD) or update locally
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crowdcheck?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/
